name: Build and Release

on:
  push:
    paths-ignore:
        - "documentation/**"
        - ".github/workflows/ci.yml"
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    permissions:
        contents: write
    name: Build and Release
    runs-on: ubuntu-latest
    outputs:
        ARENAPRO_VERSION: ${{ steps.ARENAPRO_VERSION.outputs.ARENAPRO_VERSION }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'

      - name: Run unit tests
        run: dotnet test tests/ArenaPro.Tests -c Release

      - name: Get ArenaPro Version
        id: ARENAPRO_VERSION
        run: |
            ARENAPRO_VERSION=$(grep -oP 'ModuleVersion\s*=>\s*"\K[^"]*' ArenaPro.cs)
            echo "ARENAPRO_VERSION=$ARENAPRO_VERSION" >> $GITHUB_ENV
      - name: Build and Release Artifacts
        run: |
          CSSHARP_VERSION=$(grep -Po '<PackageReference Include="CounterStrikeSharp.API" Version="\K\d+(\.\d+)*' ArenaPro.csproj)
          echo "Creating ArenaPro base package with version: $ARENAPRO_VERSION"
          dotnet publish -o package/addons/counterstrikesharp/plugins/ArenaPro
          cp -r cfg package 
          # Server data files are created by the plugin when missing; shipping them made updates overwrite admins, the
          # database settings, saved lineups and the whitelist.
          rm -f package/cfg/ArenaPro/admins.json package/cfg/ArenaPro/database.json package/cfg/ArenaPro/savednades.json package/cfg/ArenaPro/whitelist.cfg
          mkdir -p package/addons/counterstrikesharp/gamedata && cp gamedata/arenapro.json package/addons/counterstrikesharp/gamedata/
          cd package && zip -q -r ../ArenaPro-$ARENAPRO_VERSION.zip * && cd ..
    
          echo "Creating package with CounterStrikeSharp (CSSharp) v$CSSHARP_VERSION for Linux"
          cd package/
          echo "Installing CounterStrikeSharp (CSSharp) v$CSSHARP_VERSION"
          [ -e addons/counterstrikesharp ] && rm -rf addons/counterstrikesharp && echo "CounterStrikeSharp removed" || echo "old CounterStrikeSharp not found"
          curl -s https://api.github.com/repos/roflmuffin/CounterStrikeSharp/releases/tags/v$CSSHARP_VERSION |
              grep "/counterstrikesharp-with-runtime-linux-$CSSHARP_VERSION" |
              cut -d : -f 2,3 |
              tr -d \" |
              head -n 1 |
              wget -O cssharp-linux.zip -qi -
          unzip -o cssharp-linux.zip -d .
          rm cssharp-linux.zip
          cd ../

          dotnet publish -o package/addons/counterstrikesharp/plugins/ArenaPro

          mkdir -p package/addons/counterstrikesharp/gamedata && cp gamedata/arenapro.json package/addons/counterstrikesharp/gamedata/
          cd package && zip -q -r ../ArenaPro-$ARENAPRO_VERSION-with-cssharp-linux.zip * && cd ..

          rm -r package/*

          echo "Creating package with CounterStrikeSharp (CSSharp) v$CSSHARP_VERSION for Windows"
          cp -r cfg package
          # Server data files are created by the plugin when missing; shipping them made updates overwrite admins, the
          # database settings, saved lineups and the whitelist.
          rm -f package/cfg/ArenaPro/admins.json package/cfg/ArenaPro/database.json package/cfg/ArenaPro/savednades.json package/cfg/ArenaPro/whitelist.cfg
          cd package/
          echo "Installing CounterStrikeSharp (CSSharp) v$CSSHARP_VERSION"
          [ -e addons/counterstrikesharp ] && rm -rf addons/counterstrikesharp && echo "CounterStrikeSharp removed" || echo "old CounterStrikeSharp not found"
          curl -s https://api.github.com/repos/roflmuffin/CounterStrikeSharp/releases/tags/v$CSSHARP_VERSION |
              grep "/counterstrikesharp-with-runtime-windows-$CSSHARP_VERSION" |
              cut -d : -f 2,3 |
              tr -d \" |
              head -n 1 |
              wget -O cssharp-windows.zip -qi -
          unzip -o cssharp-windows.zip -d .
          rm cssharp-windows.zip
          cd ../

          dotnet publish -o package/addons/counterstrikesharp/plugins/ArenaPro

          mkdir -p package/addons/counterstrikesharp/gamedata && cp gamedata/arenapro.json package/addons/counterstrikesharp/gamedata/
          cd package && zip -q -r ../ArenaPro-$ARENAPRO_VERSION-with-cssharp-windows.zip * && cd ..

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ArenaPro ${{ env.ARENAPRO_VERSION }}
          tag_name: ${{ env.ARENAPRO_VERSION }}
          body: |
            Please see the [`CHANGELOG.md`](https://github.com/shobhit-pathak/MatchZy/blob/main/CHANGELOG.md) for details on changes.

            Installation:
            There are 3 files attached here:
            One is the ArenaPro-${{ env.ARENAPRO_VERSION }}.zip which only contains the ArenaPro plugin files. Extract its contents in csgo/ directory of the server. (Prerequisite: Metamod and CounterStrikeSharp should be already installed on the server)
            
            Second one is ArenaPro-${{ env.ARENAPRO_VERSION }}-with-cssharp-linux.zip which contains ArenaPro plugin file as well as CounterStrikeSharp files (for linux) so that you don't have to install CounterStrikeSharp separately. Simply extract its contents in csgo/ directory of the server. 
            Third one is ArenaPro-${{ env.ARENAPRO_VERSION }}-with-cssharp-windows.zip which is same as above, but for Windows.
            (Prerequisite: Metamod should be already installed on the server, rest CounterStrikeSharp and ArenaPro will be installed once you extract the contents) (WITH CSSHARP RELEASE IS RECOMMENDED FOR FIRST TIME INSTALLERS)
          draft: false
          prerelease: false
          files: |
            ArenaPro-${{ env.ARENAPRO_VERSION }}.zip
            ArenaPro-${{ env.ARENAPRO_VERSION }}-with-cssharp-linux.zip
            ArenaPro-${{ env.ARENAPRO_VERSION }}-with-cssharp-windows.zip

      - name: Publish Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: Ilshidur/action-discord@0.3.2
        with:
          args: "A new release of ArenaPro is here! ArenaPro v${{ env.ARENAPRO_VERSION }} (${{ steps.create_release.outputs.url }})"
